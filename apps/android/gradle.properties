# 项目级 Gradle 配置
# 说明：单元测试 Worker 的类路径通过 @argfile 传给 JVM，JDK 启动器按系统本地编码解析该文件
# （简体中文 Windows 为 GBK）。若 daemon 以 UTF-8 写出，则包含中文的项目路径会被解析为乱码，
# 导致测试类加载失败（ClassNotFoundException）。COMPAT 让 daemon 使用本地编码，
# 源码仍由 Kotlin / javac 按 UTF-8 读取与编译（已实测 assembleDebug 与单元测试均通过）。
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=COMPAT
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true
# 工作区路径含中文（银盾智鉴），AGP 默认拒绝此类路径。
# 已在本机通过实际构建验证；若在其他机器出现路径相关异常，建议将仓库放到纯 ASCII 路径。
android.overridePathCheck=true

kotlin.code.style=official
